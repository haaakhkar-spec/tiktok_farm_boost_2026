<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تكبيس تيك توك 2026</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; text-align: center; padding: 40px; }
        .box { max-width: 500px; margin: auto; background: #1a1a2e; padding: 30px; border-radius: 15px; border: 1px solid #25f4ee; }
        input, button { width: 100%; padding: 14px; margin: 12px 0; border-radius: 8px; border: none; font-size: 16px; }
        input { background: #222; color: #fff; border: 1px solid #444; }
        button { background: #25f4ee; color: #000; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #00d2cc; }
        #status { margin-top: 20px; color: #0f0; font-weight: bold; }
        #progress { width: 100%; height: 6px; background: #333; border-radius: 4px; margin-top: 10px; display: none; }
        #progress-bar { height: 100%; width: 0%; background: #25f4ee; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔥 تكبيس تيك توك السحابي 2026</h1>
        <input type="text" id="liveUrl" placeholder="رابط البث المباشر (مثال: https://www.tiktok.com/@user/live)">
        <input type="number" id="count" placeholder="عدد المشاهدات (مثال: 1000)">
        <button onclick="startBoost()">تشغيل التكبيس</button>
        <div id="status">المنصة جاهزة</div>
        <div id="progress"><div id="progress-bar"></div></div>
    </div>

    <script>
        async function startBoost() {
            const url = document.getElementById('liveUrl').value;
            const count = document.getElementById('count').value;
            const status = document.getElementById('status');
            const progress = document.getElementById('progress');
            const bar = document.getElementById('progress-bar');

            if (!url⠵⠞⠟⠵⠟⠺⠵⠞⠟⠟count < 1) {
                status.innerText = "⚠️ الرجاء ملء جميع الحقول";
                status.style.color = "red";
                return;
            }

            status.innerText = "⏳ جاري تجهيز الحسابات والدخول للبث...";
            status.style.color = "yellow";
            progress.style.display = "block";

            try {
                const response = await fetch('/boost', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, count })
                });

                const data = await response.json();

                if (data.success) {
                    status.innerText = ✅ تم إدخال ${count} حساب بنجاح!;
                    status.style.color = "#0f0";
                    bar.style.width = "100%";
                } else {
                    status.innerText = ❌ فشل: ${data.error};
                    status.style.color = "red";
                }
            } catch (err) {
                status.innerText = "❌ خطأ في الاتصال بالخادم";
                status.style.color = "red";
            }
        }
    </script>
</body>
</html>
